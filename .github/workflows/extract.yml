name: Extract Secret Second PNG

on:
  workflow_dispatch:

jobs:
  extract_second:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Carve Second PNG File
        run: |
          python -c '
          import os

          file_path = "png1.png"
          output_path = "real_answer.png"

          if not os.path.exists(file_path):
              print("❌ エラー: png1.png が見つかりません。")
              exit(1)

          with open(file_path, "rb") as f:
              data = f.read()

          # ファイル全体の中に「PNGの先頭シグネチャ」が何個あるか探す
          # \x89PNG\r\n\x1a\n
          png_sig = b"\x89PNG\r\n\x1a\n"
          
          # 先頭（インデックス0）以外に、2枚目のPNGの始まりがないか検索
          first_index = data.find(png_sig)
          second_index = data.find(png_sig, first_index + 1)

          if second_index != -1:
              print(f"🚀 発見！ファイルの {second_index} バイト目に2枚目の隠しPNGの先頭を検知しました！")
              second_png_data = data[second_index:]
              
              with open(output_path, "wb") as f_out:
                  f_out.write(second_png_data)
                  
              print(f"🔓 成功！隠されていた2枚目の画像を「{output_path}」として分離・保存しました！")
          else:
              # もし2枚目のシグネチャが意図的に削られている場合、
              # 今回ログに出た末尾の怪しいHexデータの塊（49444154...の前のブロック）をそのまま画像化してみる
              print("⚠️ 2枚目の明示的なPNGヘッダが見つかりません。ファイル末尾の暗号化パッチを個別に抽出します。")
              
              # ログの最末尾のデータ構造（0x799d9c...）から、PNGの形を保っている最後の数万バイトを切り出し
              # 今回は、全体のデータから最後の「怪しいバイナリ」をそのまま画像として強制ダンプします
              # 作者が「桜の画像データ(IDAT)の末尾」に生データを直書きしているパターンを考慮
              
              # 一旦、最後の5000バイトをバイナリとしてそのまま保存してみる
              with open(output_path, "wb") as f_out:
                  f_out.write(data[-5000:])
              print(f"🔓 ファイル最末尾のバイナリを「{output_path}」にダンプしました。")
          '

      - name: Upload Real Answer Image
        uses: actions/upload-artifact@v4
        with:
          name: real-answer-image
          path: real_answer.png
