name: Unlock Hidden Bottom Image

on:
  workflow_dispatch:

jobs:
  unlock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pillow
        run: pip install pillow

      - name: Force Render Whole PNG
        run: |
          python -c '
          import struct
          import zlib
          from PIL import Image, ImageFile
          import os

          # 途中でデータが終わっているように見えても強制的に最後まで読み込ませる
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          file_path = "png1.png"
          output_path = "secret_unlocked.png"

          if not os.path.exists(file_path):
              print("❌ エラー: png1.png が見つかりません。")
              exit(1)

          print("--- [ヘッダーの解析と強制書き換え] ---")
          with open(file_path, "rb") as f:
              data = bytearray(f.read())

          # IHDR チャンクから現在の解像度をパース
          orig_width = struct.unpack(">I", data[16:20])[0]
          orig_height = struct.unpack(">I", data[20:24])[0]
          print(f"現在のビューアが見ている解像度: {orig_width} x {orig_height}")

          try:
              # 10.9MBのデータ量から逆算して、高さを本来のクソデカサイズ（例として現在の3倍）に強制パディング
              test_height = orig_height * 3
              print(f"解像度を強制変更して下半分をサルベージ中... 目標高: {test_height}")
              
              # IHDRの縦幅（Height）を書き換える
              data[20:24] = struct.pack(">I", test_height)
              
              # IHDRのCRC（エラーチェック値）を再計算して修正
              ihdr_data = data[12:29]
              new_crc = zlib.crc32(ihdr_data) & 0xffffffff
              data[29:33] = struct.pack(">I", new_crc)
              
              # 書き換えた一時ファイルを保存
              with open("temp_mod.png", "wb") as f_mod:
                  f_mod.write(data)
                  
              unlocked_img = Image.open("temp_mod.png")
              unlocked_img.save(output_path)
              print(f"🔓 成功！下半分を解放した画像を「{output_path}」として保存しました！")
              print(f"サルベージ後の実際の画像サイズ: {unlocked_img.width} x {unlocked_img.height}")
              
          except Exception as e:
              print(f"❌ サルベージ中にエラーが発生しました: {e}")
          '

      - name: Upload Unlocked Image
        uses: actions/upload-artifact@v4
        with:
          name: unlocked-secret-image
          path: secret_unlocked.png
