name: Read Standard PNG Text Chunks

on:
  workflow_dispatch:

jobs:
  read_text:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Print All Text Chunks
        run: |
          python -c '
          import struct
          import os
          import zlib

          file_path = "png1.png"
          if not os.path.exists(file_path):
              print("❌ エラー: png1.png が見つかりません。")
              exit(1)

          with open(file_path, "rb") as f:
              data = f.read()

          offset = 8
          data_len = len(data)
          print("=== [標準テキストチャンクスキャン開始] ===")

          while offset < data_len:
              if offset + 8 > data_len:
                  break
              length, chunk_type = struct.unpack(">I4s", data[offset:offset+8])
              if offset + 8 + length + 4 > data_len:
                  break

              chunk_data = data[offset+8 : offset+8+length]

              # tEXt チャンクの解析 (キーワード\0テキスト)
              if chunk_type == b"tEXt":
                  parts = chunk_data.split(b"\x00", 1)
                  if len(parts) == 2:
                      print(f" Found tEXt: [{parts[0].decode(errors=\x27ignore\x27)}] -> {parts[1].decode(errors=\x27ignore\x27)}")

              # zTXt チャンクの解析 (キーワード\0圧縮方法\0圧縮テキスト)
              elif chunk_type == b"zTXt":
                  parts = chunk_data.split(b"\x00", 1)
                  if len(parts) == 2:
                      keyword = parts[0].decode(errors="ignore")
                      comp_method = parts[1][0]
                      try:
                          decompressed = zlib.decompress(parts[1][1:])
                          print(f" Found zTXt: [{keyword}] -> {decompressed.decode(errors=\x27ignore\x27)}")
                      except Exception as e:
                          print(f" Found zTXt (Decompress failed): [{keyword}]")

              offset += 8 + length + 4
          print("=== [スキャン終了] ===")
          '
