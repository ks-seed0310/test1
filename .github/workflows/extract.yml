name: Extract Appended File Data

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Extract Data After IEND
        run: |
          python -c '
          import os

          file_path = "png1.png"

          if not os.path.exists(file_path):
              print(f"❌ エラー: {file_path} が見つかりません。")
              exit(1)

          with open(file_path, "rb") as f:
              data = f.read()

          # PNGの厳密な終了サイン「IEND」の4バイト
          iend_sig = b"IEND"
          iend_index = data.find(iend_sig)

          if iend_index != -1:
              # IEND(4バイト) + その後ろにあるCRC(4バイト) = 計8バイトの後ろが「本当のお尻」
              payload_start = iend_index + 8
              appended_data = data[payload_start:]
              
              print(f"=== [解析結果] ===")
              print(f"PNGの正規データサイズ: {payload_start} バイト")
              print(f"後ろにくっついているデータのサイズ: {len(appended_data)} バイト\n")
              
              if len(appended_data) == 0:
                  print("❌ IENDの後ろには1バイトもデータがありませんでした。")
                  exit(0)

              print("--- [救出した裏データの全貌] ---")
              
              # 1. Zipファイルなどが結合されている可能性をチェック (PK..)
              if appended_data.startswith(b"PK\x03\x04"):
                  print("📦 偽装された【Zipファイル】を検知しました！")
                  print("ファイルの中にさらに別のファイルが圧縮されて隠されています。")
                  # そのままダンプするためにHex等を出します
              
              # 2. テキストとして強制表示
              print("【デコーダーを通したテキスト出力】")
              print(appended_data.decode("utf-8", errors="ignore").strip())
              
              print("\n【生データ(Hex)】")
              print(f"0x{appended_data.hex()[:1000]}") # 長すぎる場合は先頭1000文字
              
          else:
              print("❌ ファイル内に IEND マーカーが見つかりません。")
          '
