name: Decrypt Whole Image Payload

on:
  workflow_dispatch:

jobs:
  decrypt_all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pycryptodome
        run: pip install pycryptodome

      - name: ChaCha20 Decrypt Whole File
        run: |
          python -c '
          import os
          from Crypto.Cipher import ChaCha20

          file_path = "png1.png"
          output_path = "final_answer.png"

          if not os.path.exists(file_path):
              print("❌ エラー: png1.png が見つかりません。")
              exit(1)

          with open(file_path, "rb") as f:
              full_data = f.read()

          print(f"対象ファイルの総データサイズ: {len(full_data)} バイト")

          # 秘密鍵とナンス（最初の問題のセット）
          key = bytes.fromhex("24677b6b357e2396409d42911166f7ab1f5497b52b78f015bc9d6e04b02cb200")
          nonce = bytes.fromhex("01e6fa72b91da7768a3bf786")

          print("🔐 ファイル全体を ChaCha20 で復号中...")
          cipher = ChaCha20.new(key=key, nonce=nonce)
          decrypted_data = cipher.decrypt(full_data)

          # 復号データの先頭10バイトをチェック
          print(f"復号データの先頭10バイト: {decrypted_data[:10]}")
          
          # もし中にPNGのシグネチャ（\x89PNG）が埋まっていたら、そこから切り出してみる
          png_sig = b"\x89PNG\r\n\x1a\n"
          png_index = decrypted_data.find(png_sig)
          
          if png_index != -1:
              print(f"🚀 復号データ内の {png_index} バイト目に本物の隠しPNG画像を検知しました！")
              final_payload = decrypted_data[png_index:]
          else:
              print("⚠️ 明示的なPNGヘッダはありません。復号データ全体をそのまま書き出します。")
              final_payload = decrypted_data

          with open(output_path, "wb") as f_out:
              f_out.write(final_payload)
              
          print(f"🔓 完了！「{output_path}」のファイルサイズ: {len(final_payload)} バイト")
          '

      - name: Upload Final Answer Image
        uses: actions/upload-artifact@v4
        with:
          name: final-answer-image
          path: final_answer.png
