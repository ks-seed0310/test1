name: Decrypt Hidden Second PNG

on:
  workflow_dispatch:

jobs:
  decrypt_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pycryptodome pillow

      - name: ChaCha20 Decrypt Whole Payload
        run: |
          python -c '
          import os
          from Crypto.Cipher import ChaCha20

          file_path = "png1.png"
          output_path = "final_answer.png"

          if not os.path.exists(file_path):
              print("❌ エラー: png1.png が見つかりません。")
              exit(1)

          with open(file_path, "rb") as f:
              full_data = f.read()

          # 1枚目の桜のPNGの正規の終わり（IENDの直後、10,937,438バイト目）
          # ここから先が、すべて丸ごと暗号化された2枚目のPNGのデータです
          encrypted_payload = full_data[10937438:]

          if len(encrypted_payload) == 0:
              # もし位置がズレている場合を考慮し、最初のIENDを厳密に検索
              iend_index = full_data.find(b"IEND")
              if iend_index != -1:
                  encrypted_payload = full_data[iend_index + 8:]

          print(f"暗号化されたデータのサイズ: {len(encrypted_payload)} バイト")

          # 最初の謎解きで判明した「最強の鍵」と「ナンス」
          key = bytes.fromhex("24677b6b357e2396409d42911166f7ab1f5497b52b78f015bc9d6e04b02cb200")
          nonce = bytes.fromhex("01e6fa72b91da7768a3bf786")

          print("🔐 ChaCha20 で復号を実行中...")
          cipher = ChaCha20.new(key=key, nonce=nonce)
          decrypted_data = cipher.decrypt(encrypted_payload)

          # 復号されたデータが本当にPNG画像（\x89PNG）から始まっているか検証
          print(f"復号データの先頭10バイト: {decrypted_data[:10]}")

          # もしヘッダが一致しなくても、強制的にファイルとして書き出します
          with open(output_path, "wb") as f_out:
              f_out.write(decrypted_data)
              
          print(f"🔓 復号完了！「{output_path}」として保存しました！")
          '

      - name: Upload Final Answer Image
        uses: actions/upload-artifact@v4
        with:
          name: final-answer-image
          path: final_answer.png
