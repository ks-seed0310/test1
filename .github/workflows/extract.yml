name: Scan Hidden Bottom Binary

on:
  workflow_dispatch:

jobs:
  scan_bottom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Analyze Bottom Binary Data
        run: |
          python -c '
          import os
          import struct

          file_path = "png1.png"
          if not os.path.exists(file_path):
              print("❌ エラー: png1.png が見つかりません。")
              exit(1)

          with open(file_path, "rb") as f:
              data = f.read()

          # PNGの正規サイズ（1944ピクセル分）の終わりを検知するため、IDATチャンクをスキャン
          # 10.9MBもあるデータの「どのあたりから隠しバイナリが始まっているか」をチェックします
          print("=== [下半分の生バイナリスキャン開始] ===")
          
          # 画像データ全体の末尾近く（文字化けが始まった領域）に
          # もし「0x」から始まるHex文字列や、Base64、プレーンテキストが埋め込まれているか全検索
          # 10.9MBのデータから、ASCII文字（読める英数字・記号）が連続している部分を特定
          import re
          # 10文字以上連続する英数記号を検索
          matches = re.findall(b"[a-zA-Z0-9_\\-\\+\\=\\/\\:\\.\\?]{10,}", data)
          
          found_secret = False
          if matches:
              print("\n🚀 【不自然な半角英数字の塊を検知しました!】")
              for match in matches:
                  match_str = match.decode(errors="ignore")
                  # パスワードや暗号文のHex、URLっぽいものを抽出
                  if "0x" in match_str or len(match_str) > 20:
                      print(f" ┗ 📄 救出した文字列: {match_str}")
                      found_secret = True

          # また、ファイル全体の末尾1000バイトをプレーンなHexとして出力し、
          # さっきのChaCha20ツールにそのままコピペして戻せるデータがあるか確認します
          print("\n--- [ファイル最末尾の生の16進数データ (Last 500 bytes)] ---")
          tail_data = data[-500:]
          print(f"0x{tail_data.hex()}")
          '
